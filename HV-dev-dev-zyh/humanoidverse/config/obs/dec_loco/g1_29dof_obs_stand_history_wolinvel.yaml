# @package _global_

# Be careful when using _raw, history
obs:
  use_phase: True
  obs_dict:
    actor_obs: [
      # base_lin_vel,
      base_ang_vel,
      projected_gravity,
      command_lin_vel,
      command_ang_vel,
      command_stand,
      ref_upper_dof_pos,
      dof_pos,
      dof_vel,
      actions,
      sin_phase,
      cos_phase,
      # phase_time,
      history_actor
    ]

    critic_obs: [
      base_lin_vel,
      base_ang_vel,
      projected_gravity,
      command_lin_vel,
      command_ang_vel,
      command_stand,
      ref_upper_dof_pos,
      dof_pos,
      dof_vel,
      actions,
      sin_phase,
      cos_phase,
      # phase_time,
      history_critic
    ]

  # define those coumpounds in obs_dict, for example, you can define different long/short history with different length
  obs_auxiliary: 
    history_long: {
      dof_pos: 20,
      dof_vel: 2,
      actions: 15,
    }

    history_short: {
      dof_pos: 3,
      dof_vel: 2,
      actions: 1,
    }

    history_actor: {
      base_ang_vel: 4,
      projected_gravity: 4,
      command_lin_vel: 4,
      command_ang_vel: 4,
      command_stand: 4,
      ref_upper_dof_pos: 4,
      dof_pos: 4,
      dof_vel: 4,
      actions: 4,
      sin_phase: 4,
      cos_phase: 4,
      # phase_time: 4,
    }

    history_critic: {
      base_lin_vel: 4,
      base_ang_vel: 4,
      projected_gravity: 4,
      command_lin_vel: 4,
      command_ang_vel: 4,
      command_stand: 4,
      ref_upper_dof_pos: 4,
      dof_pos: 4,
      dof_vel: 4,
      actions: 4,
      sin_phase: 4,
      cos_phase: 4,
      # phase_time: 4,
    }


  obs_scales: {
    base_lin_vel: 2.0,
    base_ang_vel: 0.25,
    projected_gravity: 1.0,
    command_lin_vel: 1.0,
    command_ang_vel: 1.0,
    command_stand: 1.0,
    ref_upper_dof_pos: 1.0,
    dof_pos: 1.0,
    dof_vel: 0.05,
    history_actor: 1.0,
    history_critic: 1.0,
    actions: 1.0,
    sin_phase: 1.0,
    cos_phase: 1.0,
    phase_time: 1.0
  }
  
  add_noise: False
  noise_scales: {
    base_lin_vel: 0.0,
    base_ang_vel: 0.2,
    projected_gravity: 0.05,
    command_lin_vel: 0.0,
    command_ang_vel: 0.0,
    command_stand: 0.0,
    ref_upper_dof_pos: 0.01,
    dof_pos: 0.01,
    dof_vel: 0.25,
    actions: 0.0,
    sin_phase: 0.0,
    cos_phase: 0.0,
    phase_time: 0.0,
    history_actor: 0.0,
    history_critic: 0.0,
  }

  # obs_dims should use list instead of dict
  # will be converted to dict in `pre_process_config`
  obs_dims:
    - base_lin_vel: 3
    - base_ang_vel: 3
    - projected_gravity: 3
    - command_lin_vel: 2
    - command_ang_vel: 1
    - command_stand: 1
    - ref_upper_dof_pos: ${robot.upper_body_actions_dim} # upper body actions
    - dof_pos: ${robot.dof_obs_size}
    - dof_vel: ${robot.dof_obs_size}
    - actions: ${robot.lower_body_actions_dim} # lower body actions
    - sin_phase: 1
    - cos_phase: 1
    - phase_time: 1
