# @package _global_

# Be careful when using _raw, history
obs:
  use_phase: True
  obs_dict:
    actor_obs: [
      # base_lin_vel,
      base_ang_vel,
      projected_gravity,
      command_lin_vel,
      command_ang_vel,
      command_stand,
      command_base_height,
      command_waist_dofs,
      ref_upper_dof_pos,
      dof_pos,
      dof_vel,
      actions,
      # sin_phase,
      # cos_phase,
      history_actor
    ]

    apply_or_estimated_force_flag: [
      apply_or_estimated_force
    ]

    apply_left_ee_force: [
      left_ee_apply_force
    ]

    apply_right_ee_force: [
      right_ee_apply_force
    ]

    stance_command: [
      command_stand
    ]

    base_height_command: [
      command_base_height
    ]

    force_scale: [
      apply_force_scale
    ]

    critic_obs: [
      base_orientation,
      base_lin_vel,
      base_ang_vel,
      projected_gravity,
      command_lin_vel,
      command_ang_vel,
      command_stand,
      command_base_height,
      command_waist_dofs,
      ref_upper_dof_pos,
      dof_pos,
      dof_vel,
      actions,
      # sin_phase,
      # cos_phase,
      left_ee_apply_force,
      right_ee_apply_force,
    ]

    estimator_obs: [
      # base_lin_vel,
      base_ang_vel,
      projected_gravity,
      command_lin_vel,
      command_ang_vel,
      command_stand,
      command_base_height,
      command_waist_dofs,
      ref_upper_dof_pos,
      dof_pos,
      # dof_vel,
      actions,
      # sin_phase,
      # cos_phase,
      history_estimator,
      left_ee_comp,
      right_ee_comp,
    ]
  # define those coumpounds in obs_dict, for example, you can define different long/short history with different length
  obs_auxiliary: 
    history_actor: {
      base_ang_vel: 4,
      projected_gravity: 4,
      command_lin_vel: 4,
      command_ang_vel: 4,
      command_stand: 4,
      command_base_height: 4,
      command_waist_dofs: 4,
      ref_upper_dof_pos: 4,
      dof_pos: 4,
      dof_vel: 4,
      actions: 4,
      # sin_phase: 4,
      # cos_phase: 4,
    }

    history_estimator: {
      base_ang_vel: 9,
      projected_gravity: 9,
      command_lin_vel: 9,
      command_ang_vel: 9,
      command_stand: 9,
      command_base_height: 9,
      command_waist_dofs: 9,
      ref_upper_dof_pos: 9,
      dof_pos: 9,
      # dof_vel: 9,
      actions: 9,
      # sin_phase: 9,
      # cos_phase: 9,
      left_ee_comp: 9,
      right_ee_comp: 9,
    }

  obs_scales: {
    base_orientation: 1.0,
    base_lin_vel: 2.0,
    base_ang_vel: 0.25,
    projected_gravity: 1.0,
    command_lin_vel: 1.0,
    command_ang_vel: 1.0,
    command_stand: 1.0,
    command_base_height: 2.0,
    command_waist_dofs: 1.0,
    ref_upper_dof_pos: 1.0,
    dof_pos: 1.0,
    dof_vel: 0.05,
    actions: 1.0,
    sin_phase: 1.0,
    cos_phase: 1.0,
    phase_time: 1.0,
    left_ee_apply_force: 0.1,
    right_ee_apply_force: 0.1,
    left_ee_estimated_force: 0.1,
    right_ee_estimated_force: 0.1,
    left_ee_comp: 0.1,
    right_ee_comp: 0.1,
    history_actor: 1.0,
    history_critic: 1.0,
    history_estimator: 1.0,
    apply_force_scale: 1.0,
    apply_or_estimated_force: 1.0,
  }
  
  add_noise: False
  # noise_scales: {
  #   base_lin_vel: 0.0,
  #   base_ang_vel: 0.2,
  #   projected_gravity: 0.05,
  #   command_lin_vel: 0.0,
  #   command_ang_vel: 0.0,
  #   command_stand: 0.0,
  #   command_base_height: 0.0,
  #   ref_upper_dof_pos: 0.01,
  #   dof_pos: 0.01,
  #   dof_vel: 1.5, # 1.5
  #   actions: 0.0,
  #   sin_phase: 0.0,
  #   cos_phase: 0.0,
  #   phase_time: 0.0,
  #   history_actor: 0.0,
  #   history_critic: 0.0,
  # }
  noise_scales: {
    base_orientation: 0.0,
    base_lin_vel: 0.0,
    base_ang_vel: 0.0,
    projected_gravity: 0.0,
    command_lin_vel: 0.0,
    command_ang_vel: 0.0,
    command_stand: 0.0,
    command_base_height: 0.0,
    command_waist_dofs: 0.0,
    ref_upper_dof_pos: 0.0,
    dof_pos: 0.0,
    dof_vel: 0.1, # 1.5
    actions: 0.0,
    sin_phase: 0.0,
    cos_phase: 0.0,
    phase_time: 0.0,
    left_ee_apply_force: 0.0,
    right_ee_apply_force: 0.0,
    left_ee_estimated_force: 0.0,
    right_ee_estimated_force: 0.0,
    left_ee_comp: 0.0,
    right_ee_comp: 0.0,
    history_actor: 0.0,
    history_critic: 0.0,
    history_estimator: 0.0,
    apply_force_scale: 0.0,
    apply_or_estimated_force: 0.0,
  }

  # obs_dims should use list instead of dict
  # will be converted to dict in `pre_process_config`
  obs_dims:
    - base_orientation: 4
    - base_lin_vel: 3
    - base_ang_vel: 3
    - projected_gravity: 3
    - command_lin_vel: 2
    - command_ang_vel: 1
    - command_stand: 1
    - command_base_height: 1
    - command_waist_dofs: 3
    - ref_upper_dof_pos: ${robot.upper_body_actions_dim} # upper body actions
    - dof_pos: ${robot.dof_obs_size}
    - dof_vel: ${robot.dof_obs_size}
    - actions: ${robot.lower_body_actions_dim} # lower body actions
    - sin_phase: 1
    - cos_phase: 1
    - phase_time: 1
    - left_ee_apply_force: 3
    - right_ee_apply_force: 3
    - left_ee_estimated_force: 3
    - right_ee_estimated_force: 3
    - apply_force_scale: 1
    - left_ee_comp: ${robot.upper_body_actions_dim}
    - right_ee_comp: ${robot.upper_body_actions_dim}
    - apply_or_estimated_force: 1
